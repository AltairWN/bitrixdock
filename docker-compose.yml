---
services:
    php:
        build: ./php/php84
        container_name: bitrix_php
        volumes:
            - ${SITE_PATH}:/var/www/bitrix
            - ./logs/php:/var/log/php
            - /etc/localtime:/etc/localtime/:ro
        environment:
            TZ: Europe/Moscow
        networks:
            - bitrixdock
            - server
        dns:
            - 172.30.0.53
        extra_hosts:
            - 'host.docker.internal:host-gateway'

    web_server:
        build: ./nginx
        container_name: bitrix_nginx
        depends_on:
            - php
        volumes:
            - ${SITE_PATH}:/var/www/bitrix
            - ./logs/nginx:/var/log/nginx
            - /etc/localtime:/etc/localtime/:ro
        ports:
            - '81:80'
        networks:
            - bitrixdock
            - server
        environment:
            TZ: Europe/Moscow
        dns:
            - 172.30.0.53
        extra_hosts:
            - 'host.docker.internal:host-gateway'

networks:
    bitrixdock:
        driver: bridge
    # Общая сеть docker_server (БД, Redis, Caddy, dnsmasq)
    server:
        external: true
